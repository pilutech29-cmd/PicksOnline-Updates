name: video-drive
on:
  workflow_dispatch:
    inputs:
      id:
        description: ID del archivo de Google Drive
        required: true
      nombre:
        description: Nombre de salida (sin extension)
        required: true
permissions:
  contents: write
jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar de Drive
        run: |
          pip install -q gdown
          gdown "${{ inputs.id }}" -O original.bin
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate,codec_name -of compact original.bin
      - name: Procesar (sin audio, nostalgico)
        run: |
          N="${{ inputs.nombre }}"
          read W H < <(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=' ' original.bin)
          R=$(ffprobe -v error -select_streams v:0 -show_entries stream_side_data=rotation -of csv=p=0 original.bin | head -1)
          if [ "${R#-}" = 90 ] || [ "${R#-}" = 270 ]; then T=$W; W=$H; H=$T; fi
          LOOK="curves=preset=vintage,eq=saturation=0.72:contrast=1.04:gamma=1.03,colorbalance=rs=0.05:gs=0.02:bs=-0.06,vignette=angle=PI/4.5,noise=alls=6:allf=t+u"
          if [ "$H" -gt "$W" ]; then
            VF="[0:v]split[a][b];[a]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,gblur=sigma=30,eq=brightness=-0.08[f];[b]scale=-2:1080[c];[f][c]overlay=(W-w)/2:0,$LOOK,fps=30,format=yuv420p[v]"
          else
            VF="[0:v]scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,$LOOK,fps=30,format=yuv420p[v]"
          fi
          ffmpeg -v error -stats -i original.bin -filter_complex "$VF" -map "[v]" -an -c:v libx264 -preset veryfast -crf 23 -maxrate 6M -bufsize 12M -g 60 -movflags +faststart "$N-nostalgico.mp4"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$N-nostalgico.mp4"); echo "duracion $D"
          for p in 0.1 0.35 0.6 0.85; do ffmpeg -v error -ss $(echo "$D*$p" | bc) -i "$N-nostalgico.mp4" -frames:v 1 -q:v 3 "$N-muestra-$p.jpg"; done
          ls -la "$N"-*
      - name: Subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view media -R ${{ github.repository }} >/dev/null 2>&1 || gh release create media -R ${{ github.repository }} -t "Media Simití TV" -n "Videos procesados"
          gh release upload media "${{ inputs.nombre }}"-nostalgico.mp4 "${{ inputs.nombre }}"-muestra-*.jpg -R ${{ github.repository }} --clobber
