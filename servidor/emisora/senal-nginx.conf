# Simití TV · la señal de la emisora (HLS) para la app y simititv.com
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name senal.simititv.com _;
    ssl_certificate     /etc/simititv/origen.crt;
    ssl_certificate_key /etc/simititv/origen.key;

    location /hls/ {
        alias /var/www/hls/;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; text/html html; application/json json; }
        access_log /var/log/nginx/simiti-hls.log simiti;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-cache always;
    }
    location / { return 200 "Simití TV señal\n"; add_header Content-Type "text/plain; charset=utf-8"; }
}
