# Simití TV · pasa la señal de las emisoras (http) por https para que suenen en simititv.com
server {
    listen 80;
    listen 443 ssl;
    server_name radio.simititv.com;
    ssl_certificate     /etc/simititv/origen.crt;
    ssl_certificate_key /etc/simititv/origen.key;

    location = /simiti-original {
        proxy_pass http://uk16freenew.listen2myradio.com:10902/;
        proxy_http_version 1.1;
        proxy_set_header Host uk16freenew.listen2myradio.com:10902;
        proxy_set_header Icy-MetaData "";
        proxy_set_header User-Agent "VLC/3.0.20 LibVLC/3.0.20";
        proxy_buffering off;
        proxy_read_timeout 24h;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-cache always;
    }
    location / { return 200 "Simití TV radio\n"; add_header Content-Type text/plain; }
}
