<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Simití TV · Conectados</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061f4d;color:#fff;font:16px/1.4 system-ui,sans-serif;text-align:center}
.c{padding:24px}
h1{margin:0;font-size:18px;letter-spacing:.08em;color:#ffc928}
.n{font-size:clamp(90px,28vw,200px);font-weight:800;line-height:1;margin:8px 0}
.vivo{display:inline-flex;gap:8px;align-items:center;background:#d32f2f;padding:4px 12px;border-radius:8px;font-weight:700}
.vivo i{width:10px;height:10px;border-radius:50%;background:#fff;animation:l 1.2s infinite}
p{color:#c9d6f2;margin:14px 0 0}
b{color:#fff}
@keyframes l{50%{opacity:.3}}
</style></head><body><div class="c">
<h1>SIMITÍ TV</h1>
<div class="n" id="n">–</div>
<span class="vivo"><i></i>conectados ahora</span>
<p>Pico de hoy: <b id="p">–</b> · actualizado <span id="h">–</span></p>
<p style="font-size:13px">Cuenta conexiones distintas (una casa con varios TV en el mismo wifi cuenta como una).</p>
</div>
<script>
async function a(){try{const d=await (await fetch('conectados.json?'+Date.now(),{cache:'no-store'})).json();n.textContent=d.ahora;p.textContent=d.picoHoy;h.textContent=d.hora}catch(e){h.textContent='sin datos'}}
a();setInterval(a,10000);
</script></body></html>
