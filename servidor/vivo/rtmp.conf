# Simití TV · entrada para OBS: rtmp://IP/live + clave
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
            record off;
            allow play 127.0.0.1;
            deny play all;
            on_publish http://127.0.0.1:8935/auth;
            exec_publish /opt/simititv/vivo/al-aire.sh on;
            exec_publish_done /opt/simititv/vivo/al-aire.sh off;
        }
    }
}
